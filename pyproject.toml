[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "group_calculator"
version = "0.1.0"
description = "Calculate group stage results from text files"
readme = "README.md"
license = {text = "Apache2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Andreas Wuerl", email = "andreas@wuerl.net"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
group-calculator = "group_calculator.cli:main"

[project.urls]
Homepage = "https://github.com/oetztal/group_calculator"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
known_first_party = ["group_calculator"]

[tool.uv]
# Use UV for dependency management

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pytest-coverage>=0.0",
    "basedpyright>=1.14.0",
]

[tool.basedpyright]
# Type checking configuration
pythonVersion = "3.9"
typeCheckingMode = "standard"
